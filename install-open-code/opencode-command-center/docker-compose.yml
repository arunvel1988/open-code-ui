services:
  opencode-manager:
    build: .
    container_name: opencode-command-center
    restart: unless-stopped
    env_file: .env
    ports:
      - "${BIND_IP:-127.0.0.1}:5000:5000"
    volumes:
      - ./data:/app/data
      - opencode-home:/home/appuser
      - ${HOST_PROJECT_DIR:-./workspace}:/workspace
    environment:
      - HOME=/home/appuser
      - OPENCODE_URL=http://127.0.0.1:4096
      - PORT=5000
volumes:
  opencode-home:
